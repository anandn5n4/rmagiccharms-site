name: Instagram snapshot

# Instagram's public mirror answers differently depending on which region asks,
# so the feed cannot be read reliably while a visitor waits. It is captured here
# instead and committed, which is why the wall looks the same on every network.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Capture the feed
        run: python tools/snapshot_instagram.py

      - name: Commit the snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/instagram.json resources/instagram
          if git diff --staged --quiet; then
            echo "The feed has not changed."
          else
            git commit -m "Refresh the Instagram snapshot"
            git push
          fi
